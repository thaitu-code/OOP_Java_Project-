<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng ký FitnessAI</title>
</head>
<body>
<h2>Đăng ký tài khoản</h2>

<!-- Hiện thông báo lỗi từ Controller (ví dụ: Email đã tồn tại) -->
<div th:if="${error}" style="color: red;">
    <span th:text="${error}">Lỗi đăng ký!</span>
</div>

<!-- Form sử dụng th:object để map trực tiếp với đối tượng RegisterRequest từ Controller -->
<form th:action="@{/register}" th:object="${registerRequest}" method="post">
    <div>
        <label>Tên đăng nhập:</label>
        <input type="text" th:field="*{username}" required />
    </div>
    <div>
        <label>Email:</label>
        <input type="email" th:field="*{email}" required />
    </div>
    <div>
        <label>Mật khẩu:</label>
        <input type="password" th:field="*{password}" required />
    </div>

    <button type="submit">Đăng ký</button>
</form>

<p>Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a></p>
</body>
</html>
