<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" sizes="any" href="../static/images/fitnessai-mark.svg" th:href="@{/images/fitnessai-mark.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - FitnessAI</title>
    <!-- Mở trực tiếp file: dùng đường dẫn ../static/...  |  Chạy qua Spring Boot: Thymeleaf tự đổi sang @{/css/style.css} -->
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/app-ui.css}">
</head>
<body class="fitness-auth">
<main class="container reverse tall" id="authContainer">

    <!-- ===== PHẦN TRÁI: Nền xanh ===== -->
    <aside class="overlay-side">
        <span class="shape s1"></span>
        <span class="shape s2"></span>
        <span class="shape s3"></span>
        <span class="shape s4"></span>
        <span class="shape s5"></span>
        <div class="overlay-block">
            <h2>Chào mừng bạn!</h2>
            <p>Đã có tài khoản rồi?<br>Đăng nhập để tiếp tục hành trình của bạn</p>
            <a class="btn btn-ghost" href="login.html" th:href="@{/login}">ĐĂNG NHẬP</a>
        </div>
    </aside>

    <!-- ===== PHẦN PHẢI: Form đăng ký ===== -->
    <section class="form-side">
        <a class="brand" href="login.html" th:href="@{/login}"><img class="brand-mark" src="../static/images/fitnessai-mark.svg" th:src="@{/images/fitnessai-mark.svg}" width="32" height="32" alt=""><span class="brand-wordmark">Fitness<span class="brand-ai">AI</span></span></a>
        <div class="panel-block">
            <h1 class="title">Tạo tài khoản</h1>
            <p class="sub-text">điền thông tin bên dưới để đăng ký</p>

            <!-- Lỗi chung từ Controller (vd: Email/Username đã tồn tại) -->
            <div class="alert alert-error" style="display:none" th:if="${error}" th:style="'display:block'"><span th:text="${error}">Lỗi đăng ký!</span></div>

            <form class="auth-form" action="#" th:action="@{/register}" th:object="${registerRequest}" method="post">
                <div class="form-group">
                    <label class="field">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
                        <input aria-label="Tên đăng nhập" type="text" id="username" name="username" th:field="*{username}" placeholder="Tên đăng nhập" autocomplete="username">

                    </label>
                    <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div class="form-group">
                    <label class="field">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                        <input aria-label="Email" type="email" id="email" name="email" th:field="*{email}" placeholder="Email" autocomplete="email">

                    </label>
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="form-group">
                    <label class="field">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                        <input aria-label="Mật khẩu" type="password" id="password" name="password" th:field="*{password}" placeholder="Mật khẩu" autocomplete="new-password">
                        <button type="button" class="eye" data-toggle-password aria-label="Hiện mật khẩu"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </label>
                    <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div class="form-group">
                    <label class="field">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                        <input aria-label="Xác nhận mật khẩu" type="password" id="confirmPassword" name="confirmPassword" th:field="*{confirmPassword}" placeholder="Xác nhận mật khẩu" autocomplete="new-password">
                        <button type="button" class="eye" data-toggle-password aria-label="Hiện mật khẩu"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </label>
                    <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top:8px">ĐĂNG KÝ</button>
            </form>
        </div>
    </section>
</main>

<script src="../static/js/main.js" th:src="@{/js/main.js}"></script>
<script src="../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
