<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trợ lý FitnessAI</title>
  <meta name="_csrf" th:content="${_csrf.token}"><meta name="_csrf_header" th:content="${_csrf.headerName}">
  <meta name="app-base" th:content="@{/}">
  <link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/ai.css}">
</head>
<body><main class="ai-wrap">
  <p><a th:href="@{/home}">← Trang chủ</a></p><h1>Trợ lý FitnessAI</h1>
  <p>Hỏi đáp hoặc nói thông tin bạn muốn thay đổi. AI sẽ hỏi thêm khi cần và đưa bản xem trước để bạn xác nhận.</p>
  <section class="ai-card" aria-label="Hội thoại với AI">
    <button id="more" type="button">Xem 10 tin nhắn trước</button>
    <div id="messages" aria-live="polite"></div>
    <div id="proposals" aria-live="polite"></div>
    <form id="chat-form">
      <label for="chat-text">Tin nhắn của bạn</label>
      <textarea id="chat-text" maxlength="3000" required placeholder="Ví dụ: Hôm nay tôi vừa cân được 65 kg..."></textarea>
      <button id="send" type="submit">Gửi</button>
    </form>
    <p id="notice" role="status"></p>
    <p><a th:href="@{/nutrition#meal-plan}">Lịch ăn uống</a> · <a th:href="@{/workout#ai-calendar}">Lịch tập</a> · <a th:href="@{/profile}">Hồ sơ</a></p>
  </section>
  <section class="ai-card"><h2>Thông báo <span id="notification-count"></span></h2><div id="notifications"></div></section>
  <section class="ai-card"><h2>Kế hoạch đã lưu</h2><p>Đọc kế hoạch không đồng nghĩa đã ăn hoặc đã tập.</p><div id="recs"></div></section>
</main><script th:src="@{/js/ai.js}"></script></body></html>
