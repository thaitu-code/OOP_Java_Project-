<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu</title>
</head>
<body>
<h2>Đặt lại mật khẩu</h2>
<div th:if="${error}" style="color: red; margin-bottom: 12px;" th:text="${error}"></div>

<form th:action="@{/reset-password}" method="post">
    <!-- Token lấy từ link trong email, gửi ngầm về Controller -->
    <input type="hidden" name="token" th:value="${token}" />

    <div style="margin-bottom: 10px;">
        <label for="password">Mật khẩu mới:</label>
        <input id="password" type="password" name="password" required minlength="8"
               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
               title="Mật khẩu cần ít nhất 8 ký tự, gồm chữ hoa, chữ thường và chữ số."
               autocomplete="new-password" />
    </div>

    <div style="margin-bottom: 15px;">
        <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
        <input id="confirmPassword" type="password" name="confirmPassword" required minlength="8"
               autocomplete="new-password" />
    </div>

    <button type="submit">Xác nhận đổi mật khẩu</button>
</form>

<p><a th:href="@{/login}">Quay lại đăng nhập</a></p>
</body>
</html>
