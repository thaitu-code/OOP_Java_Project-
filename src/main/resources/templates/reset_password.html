<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/svg+xml" sizes="any" href="../static/images/fitnessai-mark.svg" th:href="@{/images/fitnessai-mark.svg}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt lại mật khẩu - FitnessAI</title>
    <!-- Mở trực tiếp file: dùng đường dẫn ../static/...  |  Chạy qua Spring Boot: Thymeleaf tự đổi sang @{/css/style.css} -->
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/app-ui.css}">
</head>
<body class="fitness-auth">
<main class="container" id="authContainer">

    <section class="form-side">
        <a class="brand" href="login.html" th:href="@{/login}"><img class="brand-mark" src="../static/images/fitnessai-mark.svg" th:src="@{/images/fitnessai-mark.svg}" width="32" height="32" alt=""><span class="brand-wordmark">Fitness<span class="brand-ai">AI</span></span></a>
        <div class="panel-block">
            <h1 class="title">Đặt lại mật khẩu</h1>
            <p class="sub-text">Tối thiểu 8 ký tự, gồm chữ hoa, chữ thường và chữ số</p>

            <div class="alert alert-error" style="display:none" th:if="${error}" th:style="'display:block'"><span th:text="${error}">Có lỗi xảy ra!</span></div>

            <form class="auth-form" action="#" th:action="@{/reset-password}" method="post">
                <!-- Token lấy từ link trong email, gửi ngầm về Controller -->
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label class="field">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                        <input aria-label="Mật khẩu mới" type="password" id="password" name="password" placeholder="Mật khẩu mới" required minlength="8"
                               pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,}"
                               title="Mật khẩu cần ít nhất 8 ký tự, gồm chữ hoa, chữ thường và chữ số."
                               autocomplete="new-password">
                        <button type="button" class="eye" data-toggle-password aria-label="Hiện mật khẩu"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </label>
                </div>
                <div class="form-group">
                    <label class="field">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
                        <input aria-label="Xác nhận mật khẩu mới" type="password" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu mới" required minlength="8"
                               autocomplete="new-password">
                        <button type="button" class="eye" data-toggle-password aria-label="Hiện mật khẩu"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </label>
                    <span class="field-error"></span>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top:8px">ĐỔI MẬT KHẨU</button>
            </form>
        </div>
    </section>

    <aside class="overlay-side">
        <span class="shape s1"></span>
        <span class="shape s2"></span>
        <span class="shape s3"></span>
        <span class="shape s4"></span>
        <span class="shape s5"></span>
        <div class="overlay-block">
            <h2>Gần xong rồi!</h2>
            <p>Chọn một mật khẩu mới thật mạnh<br>để bảo vệ tài khoản của bạn</p>
            <a class="btn btn-ghost" href="login.html" th:href="@{/login}">ĐĂNG NHẬP</a>
        </div>
    </aside>
</main>

<script src="../static/js/main.js" th:src="@{/js/main.js}"></script>
<script src="../static/js/auth.js" th:src="@{/js/auth.js}"></script>
</body>
</html>
