<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - FitnessAI</title>
    <!-- Mở trực tiếp file: dùng đường dẫn ../static/...  |  Chạy qua Spring Boot: Thymeleaf tự đổi sang @{/css/style.css} -->
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/app-ui.css}">
</head>
<body class="fitness-auth">
<main class="container short" id="authContainer">

    <section class="form-side">
        <a class="brand" href="login.html" th:href="@{/login}"><svg class="" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>FitnessAI</span></a>
        <div class="panel-block">
            <h1 class="title">Quên mật khẩu?</h1>
            <p class="sub-text">Nhập email đã đăng ký, chúng tôi sẽ gửi<br>đường dẫn để bạn đặt lại mật khẩu</p>

            <div class="alert alert-error" style="display:none" th:if="${error}" th:style="'display:block'"><span th:text="${error}">Có lỗi xảy ra!</span></div>
            <div class="alert alert-success" style="display:none" th:if="${message}" th:style="'display:block'"><span th:text="${message}">Đường dẫn đặt lại mật khẩu đã được gửi vào email của bạn.</span></div>

            <form class="auth-form" action="#" th:action="@{/forgot-password}" method="post">
                <div class="form-group">
                    <label class="field">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                        <input aria-label="Email đã đăng ký" type="email" id="email" name="email" placeholder="Email đã đăng ký" required autocomplete="email">

                    </label>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top:8px">GỬI LINK ĐẶT LẠI</button>
            </form>
        </div>
    </section>

    <aside class="overlay-side">
        <span class="shape s1"></span>
        <span class="shape s2"></span>
        <span class="shape s3"></span>
        <span class="shape s4"></span>
        <span class="shape s5"></span>
        <div class="overlay-block">
            <h2>Nhớ ra rồi?</h2>
            <p>Quay lại đăng nhập<br>và tiếp tục luyện tập thôi</p>
            <a class="btn btn-ghost" href="login.html" th:href="@{/login}">ĐĂNG NHẬP</a>
            <a class="text-btn" href="register.html" th:href="@{/register}">Chưa có tài khoản? Đăng ký</a>
        </div>
    </aside>
</main>

<script src="../static/js/main.js" th:src="@{/js/main.js}"></script>
</body>
</html>
