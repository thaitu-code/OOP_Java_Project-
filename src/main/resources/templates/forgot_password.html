<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>Quên mật khẩu</title></head>
<body>
<h2>Quên mật khẩu</h2>
<div th:if="${error}" style="color: red;" th:text="${error}"></div>
<div th:if="${message}" style="color: green;" th:text="${message}"></div>

<form th:action="@{/forgot-password}" method="post">
    <div>
        <label>Nhập email đăng ký của bạn:</label>
        <input type="email" name="email" required />
    </div>
    <button type="submit">Gửi link đặt lại</button>
</form>
<br/>
<a th:href="@{/login}">Quay lại đăng nhập</a>
</body>
</html>
