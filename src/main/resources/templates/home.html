<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Trang chủ FitnessAI</title>
</head>
<body>
<!-- Lấy tên người dùng đang đăng nhập -->
<h2>Xin chào, <span sec:authentication="name">User</span>!</h2>

<!-- Hiện Role của người dùng -->
<p>Quyền hạn của bạn: <span sec:authentication="principal.authorities"></span></p>

<form th:action="@{/perform_logout}" method="post">
    <button type="submit">Đăng xuất</button>
</form>
</body>
</html>
